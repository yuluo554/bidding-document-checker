name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e .[dev,report,web,llm]
      - name: Test
        run: python -m pytest -q -m "not installed_wheel"
      - name: Installed wheel gate
        run: python -m pytest -q -m installed_wheel
      - name: CLI smoke
        run: python -m bidchecker --version
